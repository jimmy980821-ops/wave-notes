    <marker id="ray-b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9a4e18"/></marker>
    <marker id="object" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#182532"/></marker>
  </defs>
  <rect width="640" height="403" fill="#fff"/>
  <g font-family="system-ui, sans-serif" fill="#182532">
