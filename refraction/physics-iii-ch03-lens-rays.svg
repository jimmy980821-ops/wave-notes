<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 403" role="img" aria-labelledby="title desc">
  <title id="title">會聚透鏡的實像和虛像</title>
  <desc id="desc">上圖物距大於兩倍焦距，兩條光線實際在右側相交。下圖物在焦距內，光線在右側發散，往回延長才在左側相交。</desc>
  <defs>
