      <text x="244" y="335">F</text><text x="324" y="335">O</text><text x="404" y="335">F</text>
      <text x="560" y="98">光軸</text><text x="560" y="304">光軸</text>
      <text x="60" y="383">平行入射光</text><text x="240" y="383">穿過光心的光</text><text x="445" y="383">反向延長線</text>
    </g>
  </g>
